name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Check dashboard JavaScript syntax
        run: node --check app/static/app.js

      - name: Build production container
        run: docker build --tag "jobhunt-india:${GITHUB_SHA}" .

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: jobhunt-india-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://jobhunt.prakhar.wtf
    env:
      DEPLOY_WEBHOOK_URL: https://n8n.prakhar.wtf/webhook/jobhunt-cd-deploy
      STATUS_WEBHOOK_URL: https://n8n.prakhar.wtf/webhook/jobhunt-cd-status
      DEPLOY_TOKEN: ${{ secrets.CD_DEPLOY_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Queue deployment in Coolify
        id: deployment
        shell: bash
        run: |
          set -Eeuo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 15 --max-time 45 \
              --request POST \
              --header "Content-Type: application/json" \
              --header "X-JobHunt-Deploy-Token: ${DEPLOY_TOKEN}" \
              --data "$(jq -n \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg ref "${GITHUB_REF}" \
                --arg sha "${EXPECTED_SHA}" \
                --arg run_id "${GITHUB_RUN_ID}" \
                '{repository: $repository, ref: $ref, sha: $sha, run_id: $run_id}')" \
              "${DEPLOY_WEBHOOK_URL}"
          )"

          deployment_uuid="$(jq -er '.deployments[0].deployment_uuid' <<<"${response}")"
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"
          echo "Coolify deployment ${deployment_uuid} queued for ${EXPECTED_SHA}."

      - name: Wait for the exact commit to finish
        shell: bash
        env:
          DEPLOYMENT_UUID: ${{ steps.deployment.outputs.deployment_uuid }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 90); do
            response="$(
              curl --fail-with-body --silent --show-error \
                --connect-timeout 15 --max-time 45 \
                --request POST \
                --header "Content-Type: application/json" \
                --header "X-JobHunt-Deploy-Token: ${DEPLOY_TOKEN}" \
                --data "$(jq -n \
                  --arg repository "${GITHUB_REPOSITORY}" \
                  --arg deployment_uuid "${DEPLOYMENT_UUID}" \
                  '{repository: $repository, deployment_uuid: $deployment_uuid}')" \
                "${STATUS_WEBHOOK_URL}"
            )"

            status="$(jq -er '.status' <<<"${response}")"
            echo "Deployment ${DEPLOYMENT_UUID}: ${status} (${attempt}/90)"

            case "${status}" in
              finished)
                deployed_sha="$(jq -er '.commit' <<<"${response}")"
                if [[ "${deployed_sha}" != "${EXPECTED_SHA}" ]]; then
                  echo "Expected ${EXPECTED_SHA}, but Coolify deployed ${deployed_sha}." >&2
                  exit 1
                fi
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "Coolify deployment ended with status ${status}." >&2
                exit 1
                ;;
              queued|in_progress)
                sleep 10
                ;;
              *)
                echo "Unexpected Coolify deployment status: ${status}." >&2
                exit 1
                ;;
            esac
          done

          echo "Coolify deployment did not finish within 15 minutes." >&2
          exit 1

      - name: Smoke test production
        shell: bash
        run: |
          set -Eeuo pipefail

          health="$(curl --fail-with-body --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            https://jobhunt.prakhar.wtf/health)"

          jq -e '.status == "healthy" and .database == "connected"' <<<"${health}" >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            --output /dev/null \
            https://jobhunt.prakhar.wtf/
